<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="/admin/css/admin.css">
</head>

<body>

    <header class="admin-header">

        <h1>Admin Dashboard</h1>

        <div>
            <button id="backToProducts">
                ← Back to Products
            </button>

            <button id="logoutBtn">
                Logout
            </button>
        </div>

    </header>


    <main class="admin-container">

        <div class="page-header">

            <div>
                <h2>Product Management</h2>
                <p>Add, edit and delete products.</p>
            </div>

            <button id="addProductBtn">
                + Add Product
            </button>

        </div>


        <div id="message"></div>


        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="productTableBody">

                    <tr>
                        <td colspan="7">
                            Loading products...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </main>


    <!-- Add/Edit Product Modal -->

    <div id="productModal" class="modal hidden">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Add Product
                </h2>

                <button id="closeModalBtn">
                    ×
                </button>

            </div>


            <form id="productForm">

                <input
                    type="hidden"
                    id="productId"
                >


                <label for="name">
                    Product Name
                </label>

                <input
                    type="text"
                    id="name"
                    required
                >


                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    rows="4"
                    required
                ></textarea>


                <label for="price">
                    Price
                </label>

                <input
                    type="number"
                    id="price"
                    min="0"
                    step="0.01"
                    required
                >


                <label for="stock">
                    Stock
                </label>

                <input
                    type="number"
                    id="stock"
                    min="0"
                    required
                >


                <label for="category">
                    Category
                </label>

                <input
                    type="text"
                    id="category"
                    required
                >


                <label for="imageUrl">
                    Image URL
                </label>

                <input
                    type="url"
                    id="imageUrl"
                    placeholder="https://example.com/image.jpg"
                >


                <div class="form-actions">

                    <button
                        type="button"
                        id="cancelBtn"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        id="saveProductBtn"
                    >
                        Save Product
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="/admin/js/admin.js"></script>

</body>

</html>
