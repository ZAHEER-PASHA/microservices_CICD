<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>E-Commerce - Products</title>

<link rel="stylesheet" href="/css/style.css">


</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">

    <div class="logo">
        E-Commerce
    </div>

    <div class="user-section">

        <span id="welcomeUser">
            Welcome
        </span>

        <button
            id="ordersBtn"
            class="btn-secondary">
            My Orders
        </button>

        <button
            id="logoutBtn"
            class="btn-logout">
            Logout
        </button>

    </div>

</nav>


<!-- =========================
     MAIN CONTENT
========================= -->

<main class="container">

    <div class="page-header">

        <div>
            <h1>Products</h1>

            <p>
                Choose a product and place your order.
            </p>
        </div>

    </div>


    <div
        id="message"
        class="message">
    </div>


    <!-- =========================
         PRODUCT GRID
    ========================= -->

    <div
        id="productContainer"
        class="product-grid">

        <div class="empty-state">

            <h2>
                Loading products...
            </h2>

            <p>
                Please wait.
            </p>

        </div>

    </div>

</main>


<script src="/js/app.js"></script>


</body>

</html>
