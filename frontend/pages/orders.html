<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Orders</title>
    <link rel="stylesheet" href="/css/orders.css?v=2">

</head>

<body>

    <div class="orders-header">

        <button id="backToProducts" class="btn-secondary">
            ← Back to Products
        </button>

        <h1>My Orders</h1>

        <button id="logoutBtn" class="btn-secondary">
            Logout
        </button>

    </div>


    <!-- ======================================
         PENDING ORDERS
    ======================================= -->

    <h2>Pending Orders</h2>

    <p id="pendingMessage">
        Loading orders...
    </p>

    <div id="pendingOrders"></div>


    <hr>


    <!-- ======================================
         COMPLETED ORDERS
    ======================================= -->

    <h2>Completed Orders</h2>

    <p id="completedMessage">
        Loading orders...
    </p>

    <div id="completedOrders"></div>


    <script src="/js/orders.js?v=2"></script>

</body>

</html>
