services:

  order-service:

    build:
      context: .

    container_name: ecommerce-order-service

    ports:
      - "5003:5003"

    environment:

      PORT: 5003

      DB_HOST: order-mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: ecommerce_orders

      JWT_SECRET: my_super_secret_jwt_key_change_later
      JWT_EXPIRES_IN: 1h

      NODE_ENV: development

      PRODUCT_SERVICE_URL: http://product-service:5002

    depends_on:

      order-mysql:
        condition: service_healthy

    networks:
      - default
      - ecommerce-network


  order-mysql:

    image: mysql:8.4

    container_name: ecommerce-order-mysql

    environment:

      MYSQL_ROOT_PASSWORD: root123

      MYSQL_DATABASE: ecommerce_orders

    ports:

      - "3307:3306"

    volumes:

      - order_mysql_data:/var/lib/mysql

    healthcheck:

      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot123"
        ]

      interval: 5s

      timeout: 5s

      retries: 10


volumes:

  order_mysql_data:


networks:

  ecommerce-network:
    external: true